server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sendwise?serverTimezone=Asia/Seoul
    username: sendwise
    password: sendwise
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
sendwise:
  rules-dir: ../../packages/rules
  carrier-base-url: http://localhost:8081
  carrier-rate-per-second: 50
  dispatcher-enabled: true
  export-dir: build/exports
  fixed-now: ""
